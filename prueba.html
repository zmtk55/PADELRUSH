<!DOCTYPE html>

<body style="font-family:sans-serif;padding:2rem;">
  <h1>Prueba de conexión a Supabase</h1>
  <div id="result">Cargando...</div>
  <script>
    const url = 'https://xmpsqjhywmwdekuhudtt.supabase.co/rest/v1/leagues?select=*&order=created_at.desc'
    const headers = {
      apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcHNxamh5d213ZGVrdWh1ZHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjM5NzgsImV4cCI6MjA5MzgzOTk3OH0.-6CSavZAVZhRV72MTsaoJZN0cRvlS8ee-9Tc2jFuLRQ',
      Authorization: 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcHNxamh5d213ZGVrdWh1ZHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjM5NzgsImV4cCI6MjA5MzgzOTk3OH0.-6CSavZAVZhRV72MTsaoJZN0cRvlS8ee-9Tc2jFuLRQ',
      Accept: 'application/json'
    }
    
    const result = document.getElementById('result')
    const start = Date.now()
    
    fetch(url, { headers })
      .then(r => { 
        if (!r.ok) throw new Error('HTTP ' + r.status)
        return r.json()
      })
      .then(data => {
        result.innerHTML = `<p style="color:green">✅ CONEXIÓN EXITOSA (${Date.now() - start}ms)</p>
        <p>Datos recibidos: ${JSON.stringify(data, null, 2)}</p>`
      })
      .catch(err => {
        result.innerHTML = `<p style="color:red">❌ ERROR: ${err.message}</p>
        <p>Tiempo: ${Date.now() - start}ms</p>`
      })
  </script>
</body></html>
